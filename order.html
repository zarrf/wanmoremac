<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanMoreMac | Place Your Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="order-page-bg">
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">WANMOREMAC</a>
            <a class="btn btn-outline-light btn-sm" href="index.html#menu">Back to Menu</a>
        </div>
    </nav>

    <main class="py-5">
        <div class="container">
            <div class="row g-4 align-items-center justify-content-center">
                <div class="col-lg-5">
                    <div class="card shadow order-card p-3 p-md-4">
                        <img id="itemImage" class="order-image" src="" alt="Selected menu item">
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="card shadow order-card p-4">
                        <p class="text-uppercase small text-orange fw-semibold mb-2">Customize your order</p>
                        <h1 id="itemName" class="fw-bold mb-2">Menu Item</h1>
                        <p class="text-muted mb-4">Choose the quantity, review the total, and confirm your order in one place.</p>

                        <div class="d-flex align-items-center gap-3 mb-4">
                            <button type="button" id="decreaseBtn" class="btn btn-outline-orange quantity-btn">−</button>
                            <input id="quantityInput" class="form-control text-center quantity-input" type="number" min="1" max="10" value="1">
                            <button type="button" id="increaseBtn" class="btn btn-order quantity-btn">+</button>
                        </div>

                        <div class="bg-cream rounded-4 p-3 mb-4">
                            <div class="d-flex justify-content-between text-dark-brown mb-2">
                                <span>Price per bowl</span>
                                <strong id="unitPrice">RM 0</strong>
                            </div>
                            <div class="d-flex justify-content-between text-dark-brown mb-2">
                                <span>Quantity</span>
                                <strong id="qtyDisplay">1</strong>
                            </div>
                            <div class="d-flex justify-content-between fs-5 fw-bold text-orange">
                                <span>Total</span>
                                <strong id="totalPrice">RM 0</strong>
                            </div>
                        </div>

                        <button id="confirmBtn" class="btn btn-order btn-lg w-100 py-3 fw-bold">Confirm Order</button>
                        <p id="confirmationMessage" class="mt-3 text-success fw-semibold d-none">Your order has been confirmed.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 text-white">
        <p class="mb-0">&copy; 2026 WanMoreMac. All Rights Reserved.</p>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const itemName = params.get('item') || 'Classic Mac';
        const price = Number(params.get('price') || 0);
        const image = params.get('image') || 'classic-mac.jpeg';

        const itemNameEl = document.getElementById('itemName');
        const itemImageEl = document.getElementById('itemImage');
        const unitPriceEl = document.getElementById('unitPrice');
        const qtyDisplayEl = document.getElementById('qtyDisplay');
        const totalPriceEl = document.getElementById('totalPrice');
        const quantityInputEl = document.getElementById('quantityInput');
        const confirmBtn = document.getElementById('confirmBtn');
        const confirmationMessageEl = document.getElementById('confirmationMessage');

        itemNameEl.textContent = itemName;
        itemImageEl.src = image;
        itemImageEl.alt = itemName;
        unitPriceEl.textContent = 'RM ' + price;

        function updateTotal() {
            let qty = Number(quantityInputEl.value) || 1;
            if (qty < 1) qty = 1;
            if (qty > 10) qty = 10;
            quantityInputEl.value = qty;
            qtyDisplayEl.textContent = qty;
            totalPriceEl.textContent = 'RM ' + (price * qty);
        }

        document.getElementById('increaseBtn').addEventListener('click', function () {
            quantityInputEl.value = Math.min(10, Number(quantityInputEl.value || 1) + 1);
            updateTotal();
        });

        document.getElementById('decreaseBtn').addEventListener('click', function () {
            quantityInputEl.value = Math.max(1, Number(quantityInputEl.value || 1) - 1);
            updateTotal();
        });

        quantityInputEl.addEventListener('input', updateTotal);

        confirmBtn.addEventListener('click', function () {
            const qty = Number(quantityInputEl.value) || 1;
            confirmationMessageEl.textContent = 'Order confirmed: ' + qty + ' bowl(s) of ' + itemName + ' for RM ' + (price * qty) + '.';
            confirmationMessageEl.classList.remove('d-none');
        });

        updateTotal();
    </script>
</body>
</html>
